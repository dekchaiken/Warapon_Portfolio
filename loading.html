<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Initializing Interface // Warapon Leadlum</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-primary: #282a36;
            --bg-secondary: #44475a;
            --text-primary: #f8f8f2;
            --text-secondary: #6272a4;
            --accent-color: #bd93f9;
            --border-color: #6272a4;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Fira Code', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .loading-editor {
            width: 90%;
            max-width: 800px;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        .editor-header {
            background-color: #1e1f29;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.red { background-color: #ff5f56; }
        .dot.yellow { background-color: #ffbd2e; }
        .dot.green { background-color: #27c93f; }

        .file-tab {
            margin-left: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .editor-content {
            padding: 1.5rem;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .loading-line {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        .line-number {
            color: var(--text-secondary);
            min-width: 2rem;
            text-align: right;
        }

        .loading-text {
            color: var(--text-primary);
        }

        .keyword { color: #ff79c6; }
        .string { color: #f1fa8c; }
        .comment { color: #6272a4; }
        .function { color: #50fa7b; }
        .variable { color: #bd93f9; }
        .number { color: #bd93f9; }

        .progress-bar {
            width: 100%;
            height: 2px;
            background-color: var(--bg-primary);
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background-color: var(--accent-color);
            animation: progress 2s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes progress {
            from { width: 0%; }
            to { width: 100%; }
        }

        .loading-line:nth-child(1) { animation-delay: 0.1s; }
        .loading-line:nth-child(2) { animation-delay: 0.3s; }
        .loading-line:nth-child(3) { animation-delay: 0.5s; }
        .loading-line:nth-child(4) { animation-delay: 0.7s; }
        .loading-line:nth-child(5) { animation-delay: 0.9s; }
        .loading-line:nth-child(6) { animation-delay: 1.1s; }
        .loading-line:nth-child(7) { animation-delay: 1.3s; }
        .loading-line:nth-child(8) { animation-delay: 1.5s; }

        @media (max-width: 768px) {
            .loading-editor {
                width: 95%;
            }
            
            .editor-content {
                padding: 1rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="loading-editor">
        <div class="editor-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="file-tab">initializing.js</span>
        </div>
        <div class="editor-content">
            <div class="loading-line">
                <span class="line-number">1</span>
                <span class="loading-text"><span class="comment">// Initializing interface...</span></span>
            </div>
            <div class="loading-line">
                <span class="line-number">2</span>
                <span class="loading-text"><span class="keyword">const</span> <span class="variable">app</span> = <span class="keyword">new</span> <span class="function">Portfolio</span>();</span>
            </div>
            <div class="loading-line">
                <span class="line-number">3</span>
                <span class="loading-text"><span class="comment">// Loading components...</span></span>
            </div>
            <div class="loading-line">
                <span class="line-number">4</span>
                <span class="loading-text"><span class="keyword">await</span> app.<span class="function">loadComponents</span>();</span>
            </div>
            <div class="loading-line">
                <span class="line-number">5</span>
                <span class="loading-text"><span class="comment">// Initializing theme...</span></span>
            </div>
            <div class="loading-line">
                <span class="line-number">6</span>
                <span class="loading-text">app.<span class="function">setTheme</span>(<span class="string">'dark'</span>);</span>
            </div>
            <div class="loading-line">
                <span class="line-number">7</span>
                <span class="loading-text"><span class="comment">// Starting application...</span></span>
            </div>
            <div class="loading-line">
                <span class="line-number">8</span>
                <span class="loading-text">app.<span class="function">start</span>();</span>
            </div>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>
    </div>

    <script>
        // Prevent back button from showing loading page again
        window.history.pushState(null, '', window.location.href);
        window.onpopstate = function() {
            window.history.pushState(null, '', window.location.href);
        };

        // Redirect to main page after loading animation
        setTimeout(() => {
            window.location.replace('index.html');
        }, 3000);
    </script>
</body>
</html>
